{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h1>Create an Account</h1>

<p>
Please complete the form below to register as either a Buyer or Vendor.
</p>

{% if form.errors %}
<div style="color: red;">
    <h3>Form Errors</h3>
    {{ form.errors }}
</div>
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Register
    </button>

</form>

{% endblock %}
