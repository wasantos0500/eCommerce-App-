{% extends "base.html" %}

{% block content %}

<h1>My Products</h1>

<p>

<a href="{% url 'create_product' %}">

Add Product

</a>

</p>

<hr>

{% if products %}

<ul>

{% for product in products %}

<li>

<strong>{{ product.name }}</strong>

<br>

£{{ product.price }}

<br>

Stock: {{ product.stock }}

</li>

{% endfor %}

</ul>

{% else %}

<p>

No products have been added yet.

</p>

{% endif %}

{% endblock %}
