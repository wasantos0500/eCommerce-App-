{% extends "base.html" %}

{% block title %}Products{% endblock %}

{% block content %}

<h2 class="mb-4">Browse Products</h2>

<div class="row">

{% for product in products %}

<div class="col-md-4 mb-4">

<div class="card shadow-sm">

<div class="card-body">

<h4>

{{ product.name }}

</h4>

<p class="text-muted mb-2">

Sold by 

<a href="{% url 'public_store_detail' product.store.id %}">

{{ product.store.name }}

</a>

</p>

<p>

{{ product.description|truncatewords:20 }}

</p>

<a
href="{% url 'public_product_detail' product.id %}"
class="btn btn-primary">

View Details

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
