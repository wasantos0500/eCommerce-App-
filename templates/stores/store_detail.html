{% extends "base.html" %}

{% block title %}
Store Details
{% endblock %}

{% block content %}

<div class="card shadow">

<div class="card-body">

<h2>

{{ store.name }}

</h2>

<hr>

<p>

{{ store.description }}

</p>

<hr>

<p>

<strong>

Owner:

</strong>

{{ store.owner.username }}

</p>

<a
href="{% url 'update_store' store.id %}"
class="btn btn-warning">

Edit Store

</a>

<a
href="{% url 'dashboard' %}"
class="btn btn-secondary">

Back

</a>

</div>

</div>

{% endblock %}
